name: Daily job search

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 08:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run job search agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          export TODAY=$(TZ=Asia/Kolkata date +%F)
          { echo "Today (IST): $TODAY"; echo; cat prompt.md; } > /tmp/prompt.md
          claude -p "$(cat /tmp/prompt.md)" \
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep" \
            --max-turns 150 \
            --output-format text | tee /tmp/claude-output.txt

      - name: Rebuild JOBS.md
        run: node scripts/build-jobs-view.mjs

      - name: Commit results
        run: |
          git config user.name "job-search-bot"
          git config user.email "job-search-bot@users.noreply.github.com"
          git add tracker.json reports JOBS.md
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Daily job search $(TZ=Asia/Kolkata date +%F)"
          git push
